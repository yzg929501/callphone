name: 构建 WebPhone APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          if ! command -v sdkmanager >/dev/null; then export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"; fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle 8.7
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          mkdir -p "$HOME/gradle"
          unzip -q -o /tmp/g.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 解压并编译
        run: |
          ZIP=$(ls *Android*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -1); fi
          echo "工程包: $ZIP"
          rm -rf project && mkdir project
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('project')" "$ZIP"
          SRC=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "工程目录: $SRC"
          cd "$SRC"
          gradle assembleDebug --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          cp "$APK" "$GITHUB_WORKSPACE/WebPhone-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/WebPhone-debug.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WebPhone-debug-apk
          path: WebPhone-debug.apk
          if-no-files-found: error
